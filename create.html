<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SUPER REAPER - Create Account</title>

    <style>
        * {                    
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-y: auto;

            background:
                radial-gradient(circle at 15% 20%, #ff00cc55, transparent 35%),
                radial-gradient(circle at 85% 25%, #0066ff55, transparent 35%),
                radial-gradient(circle at 50% 100%, #8a00ff55, transparent 45%),
                linear-gradient(135deg, #070018, #050525 50%, #000b25);
        }

        /* Glowing background effects */
        body::before {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            left: -200px;
            top: 100px;
            background: #ff00cc;
            filter: blur(180px);
            opacity: 0.25;
            z-index: -1;
        }

        body::after {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            right: -200px;
            bottom: 50px;
            background: #0066ff;
            filter: blur(180px);
            opacity: 0.25;
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 680px;
            padding: 35px 20px;
            text-align: center;
        }

        /* LOGO */
        .logo {
            margin-bottom: 30px;
        }

        .skull {
            font-size: 75px;
            filter:
                drop-shadow(0 0 10px #ff00cc)
                drop-shadow(0 0 25px #0066ff);
        }

        .logo h1 {
            margin-top: -5px;
            font-size: 52px;
            font-weight: 900;
            font-style: italic;
            letter-spacing: -3px;

            background: linear-gradient(
                90deg,
                #ff00dd,
                #8b5cff,
                #00aaff
            );

            -webkit-background-clip: text;
            color: transparent;

            text-shadow:
                0 0 15px #ff00cc55,
                0 0 30px #0066ff55;
        }

        .logo p {
            color: #aaaaff;
            letter-spacing: 5px;
            font-size: 13px;
            margin-top: 5px;
        }
         
         /* SUPER REAPER IMAGE LOGO */
        .logo-image {
            width: 420px;
            max-width: 90%;
            display: block;
            margin: 0 auto 25px;
            filter:
                drop-shadow(0 0 10px #ff00cc)
                drop-shadow(0 0 20px #0066ff)
                drop-shadow(0 0 35px #7b00ff);
        }

        /* MR.HACKER PRESENTS */
.hacker-presents {
    margin-top: 30px;
    text-align: center;
    font-family: "Courier New", monospace;
    letter-spacing: 4px;
    animation: hackerGlow 2s infinite alternate;
}

.hacker-presents span {
    display: block;
    font-size: 24px;
    font-weight: bold;
    color: #00ff88;

    text-shadow:
        0 0 5px #00ff88,
        0 0 15px #00ff88,
        0 0 30px #00ff88;
}

.hacker-presents b {
    display: block;
    margin-top: 5px;
    font-size: 13px;
    color: #00ccff;
    letter-spacing: 7px;

    text-shadow:
        0 0 5px #00ccff,
        0 0 15px #0066ff;
}

@keyframes hackerGlow {
    from {
        opacity: 0.7;
        transform: scale(0.98);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}
        /* CARD */
        .card {
            padding: 40px;
            border-radius: 25px;

            background: rgba(5, 5, 35, 0.82);

            border: 2px solid transparent;
            background:
                linear-gradient(#08082b, #08082b) padding-box,
                linear-gradient(
                    90deg,
                    #ff00dd,
                    #7b35ff,
                    #008cff
                ) border-box;

            box-shadow:
                0 0 20px #ff00cc44,
                0 0 45px #0066ff33;

            backdrop-filter: blur(12px);
        }

        .card h2 {
            font-size: 38px;
            margin-bottom: 10px;

            background: linear-gradient(
                90deg,
                #ff00dd,
                #8b5cff,
                #008cff
            );

            -webkit-background-clip: text;
            color: transparent;
        }

        .subtitle {
            color: #aaaacc;
            margin-bottom: 30px;
            font-size: 16px;
        }

        /* INPUTS */
        .input-box {
            position: relative;
            margin-bottom: 18px;
        }

        .input-box input {
            width: 100%;
            height: 70px;
            padding: 0 25px;

            border-radius: 17px;
            border: 1px solid #6b3acb;

            background: rgba(8, 8, 45, 0.9);
            color: white;

            font-size: 17px;
            outline: none;

            box-shadow:
                inset 0 0 15px #00000055,
                0 0 10px #651cff22;

            transition: 0.3s;
        }

        .input-box input::placeholder {
            color: #9999cc;
        }

        .input-box input:focus {
            border-color: #b000ff;

            box-shadow:
                0 0 12px #ff00cc88,
                0 0 25px #0066ff44;
        }

        /* PASSWORD ICON */
        .password-icon {
            position: absolute;
            right: 22px;
            top: 23px;
            color: #aaaaff;
            cursor: pointer;
            font-size: 22px;
        }

        /* TERMS */
        .terms {
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: left;
            color: #aaaacc;
            font-size: 14px;
            margin: 8px 3px 25px;
        }

        .terms input {
            width: 20px;
            height: 20px;
            accent-color: #b000ff;
        }

        .terms a {
            color: #168cff;
            text-decoration: none;
        }

        .terms a:hover {
            color: #ff00dd;
        }

        /* CREATE BUTTON */
        .create-btn {
            width: 100%;
            height: 70px;

            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;

            border: none;
            border-radius: 17px;

            color: white;
            font-size: 21px;
            font-weight: bold;
            letter-spacing: 1px;

            cursor: pointer;

            background:
                linear-gradient(
                    90deg,
                    #ff00cc,
                    #9d25ff,
                    #006eff
                );

            box-shadow:
                0 0 15px #ff00cc88,
                0 0 30px #006eff44;

            transition: 0.3s;
        }

        .create-btn:hover {
            transform: translateY(-3px);

            box-shadow:
                0 0 20px #ff00cc,
                0 0 45px #006eff88;
        }

        .create-btn:active {
            transform: scale(0.98);
        }

        /* DIVIDER */
        .divider {
            display: flex;
            align-items: center;
            gap: 20px;
            margin: 30px 0 20px;
            color: #aaaacc;
        }

        .divider::before,
        .divider::after {
            content: "";
            height: 1px;
            flex: 1;
            background: #484878;
        }

        /* LOGIN LINK */
        .login-text {
            color: #aaaacc;
            font-size: 15px;
        }

        .login-text a {
            display: block;
            margin-top: 12px;

            color: #d735ff;
            font-size: 17px;
            font-weight: bold;

            text-decoration: none;
        }

        .login-text a:hover {
            color: #008cff;
            text-shadow: 0 0 10px #008cff;
        }

        /* FOOTER */
        footer {
            margin-top: 45px;
            color: #777799;
            font-size: 13px;
        }

        footer a {
            color: #9999cc;
            text-decoration: none;
            margin: 0 12px;
        }

        footer a:hover {
            color: #ff00dd;
        }

        /* MOBILE */
        @media (max-width: 600px) {

            .container {
                padding: 25px 15px;
            }

            .logo h1 {
                font-size: 40px;
            }

            .skull {
                font-size: 60px;
            }

            .card {
                padding: 25px 20px;
            }

            .card h2 {
                font-size: 30px;
            }

            .input-box input {
                height: 60px;
            }

            .create-btn {
                height: 60px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- SUPER REAPER LOGO -->
        <div class="logo">
            <img src="super-reaper-logo.png" class="logo-image" alt="SUPER REAPER">
        </div>


        <!-- CREATE ACCOUNT CARD -->
        <div class="card">

            <h2>Create Account</h2>

            <p class="subtitle">
                Join the Super Reaper world.
            </p>


            <!-- USERNAME -->
            <div class="input-box">
                <input
                    type="text"
                    id="username"
                    placeholder="Username"
                    required
                >
            </div>


            <!-- EMAIL -->
            <div class="input-box">
                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
                >
            </div>


            <!-- PASSWORD -->
            <div class="input-box">

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <span
                    class="password-icon"
                    onclick="showPassword('password', this)"
                >👁</span>

            </div>


            <!-- CONFIRM PASSWORD -->
            <div class="input-box">

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm Password"
                    required
                >

                <span
                    class="password-icon"
                    onclick="showPassword('confirmPassword', this)"
                >👁</span>

            </div>


            <!-- TERMS -->
            <label class="terms">

                <input type="checkbox" id="terms">

                <span>
                    I agree to the
                    <a href="#">Terms & Conditions</a>
                </span>

            </label>


            <!-- BUTTON -->
           <a href="games.html" class="create-btn">
               CREATE ACCOUNT &nbsp; →
           </a>


            <!-- LOGIN -->
            <div class="divider">
                Already registered?
            </div>

            <div class="login-text">
                Have an account?

                <a href="signin.html">
                    LOGIN
                </a>
            </div>

        </div>
     


        <!-- MR.HACKER PRESENTS -->
        <div class="hacker-presents">
             <span>MR.HACKER</span>
             <b>PRESENTS</b>
         </div>

        <!-- FOOTER -->
        <footer>

            <a href="#">Terms & Conditions</a>

            |

            <a href="#">Privacy Policy</a>

            |

            <a href="#">Contact Us</a>

        </footer>

    </div>


    <script>

        function showPassword(id, icon) {

            const input = document.getElementById(id);

            if (input.type === "password") {

                input.type = "text";
                icon.textContent = "🙈";

            } else {

                input.type = "password";
                icon.textContent = "👁";

            }
        }


        function createAccount() {

            const username =
                document.getElementById("username").value;

            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            const terms =
                document.getElementById("terms").checked;


            if (
                username === "" ||
                email === "" ||
                password === "" ||
                confirmPassword === ""
            ) {

                alert("Please fill in all fields.");
                return;
            }


            if (password !== confirmPassword) {

                alert("Passwords do not match.");
                return;
            }


            if (!terms) {

                alert("Please accept the Terms & Conditions.");
                return;
            }


            alert("Account created successfully!");

            window.location.href = "signin.html";
        }

    </script>

</body>
</html>
